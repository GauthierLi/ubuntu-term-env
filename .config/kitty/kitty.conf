# =================
# 基础显示设置
# =================


# 字体配置
font_family      CodeNewRoman Nerd Font Mono Regular
bold_font        CodeNewRoman Nerd Font Mono Bold
italic_font      CodeNewRoman Nerd Font Mono Italic
bold_italic_font CodeNewRoman Nerd Font Mono Italic
font_size        14.0

# 背景设置
dynamic_background_opacity yes

# 窗口设置
hide_window_decorations  titlebar-only
initial_window_width  1200
initial_window_height 800
window_padding_width  10
background_opacity  0.8
background_blur  30
remember_window_size_and_position yes

# bar设置
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# =================
# 新功能设置 (0.43+)
# =================

# 滚动条配置（Kitty 默认启用）
scrollbar_width 8

# =================
# 交互功能设置  
# =================

# 启用远程控制（主题切换、Sessions必需）
allow_remote_control yes

# 复制粘贴优化
copy_on_select yes
strip_trailing_spaces smart


# =================
# Kitty快捷键映射配置
# =================


# 窗口分割（kitty快捷键核心功能）
map cmd+j launch --location=hsplit
map cmd+k launch --location=vsplit
map cmd+w close_window


# 多光标操作 (0.43+)
#map cmd+shift+up add_cursor_up
#map cmd+shift+down add_cursor_down


# 快速配置kitty美化
map cmd+, edit_config_file

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
